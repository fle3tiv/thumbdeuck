backend = "xrender";
vsync = false;
shadow = false;
shadow-radius = 16;
shadow-opacity = 0.4;
shadow-offset-x = -14;
shadow-offset-y = -12;
shadow-exclude = [ "name = 'tdpanel'", "name = 'tdmenu'", "name = 'tdstrip'" ];
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 8;
use-damage = false;
